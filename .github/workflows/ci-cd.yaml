name: CI/CD

# Manual trigger only: Actions tab -> CI/CD -> Run workflow (branch: test)
on:
  workflow_dispatch:

permissions:
  contents: write   # push the image-tag bump to test
  packages: write   # push images to ghcr.io

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/shoplite
  CHART_DIR: helm/shoplite

jobs:
  validate:
    # main is protected; ArgoCD dev tracks test, so the pipeline only runs from test
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4

      - name: Lint and render chart
        run: |
          helm lint "$CHART_DIR" -f "$CHART_DIR/values-dev.yaml"
          helm template shoplite "$CHART_DIR" -f "$CHART_DIR/values-dev.yaml" > /dev/null

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users-service, orders-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ needs.validate.outputs.tag }}
            ${{ env.IMAGE_REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    # Deploy the freshly built images to a throwaway kind cluster and smoke-test them
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: shoplite-e2e

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-load images so the test works even while the ghcr packages are private
      - name: Load images into kind
        run: |
          for svc in users-service orders-service frontend; do
            docker pull "$IMAGE_REPO/$svc:$TAG"
            kind load docker-image "$IMAGE_REPO/$svc:$TAG" --name shoplite-e2e
          done

      - name: Install chart
        run: |
          helm install shoplite "$CHART_DIR" \
            -f "$CHART_DIR/values-dev.yaml" \
            --set image.tag="$TAG" \
            --namespace shoplite-e2e --create-namespace \
            --wait --timeout 3m

      - name: Run e2e tests
        run: |
          kubectl -n shoplite-e2e port-forward svc/frontend 8080:3000 >/tmp/pf.log 2>&1 &
          scripts/e2e-test.sh http://localhost:8080

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n shoplite-e2e get pods -o wide
          kubectl -n shoplite-e2e describe pods
          kubectl -n shoplite-e2e logs -l app.kubernetes.io/instance=shoplite --all-containers --tail=50

  promote:
    # GitOps: bump the tag in values-dev.yaml; ArgoCD picks it up from the test branch
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - name: Update image tag
        run: yq -i '.image.tag = strenv(TAG)' "$CHART_DIR/values-dev.yaml"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "values-dev.yaml already at $TAG"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): shoplite $TAG"
          git pull --rebase origin test
          git push origin HEAD:test
