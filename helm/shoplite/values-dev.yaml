# Dev environment (kind cluster). ArgoCD reads this file from the `test` branch.
# image.tag is bumped automatically by the GitHub Actions pipeline - don't edit by hand.

image:
  tag: sha-fa01a64
services:
  orders-service:
    resources:
      requests:
        cpu: 50m
        memory: 20Mi
      limits:
        cpu: 200m
        memory: 20Mi
  frontend:
    service:
      # Exposed on the kind node; the kind module maps host 8080 -> node 30080
      type: NodePort
      nodePort: 30080
