{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoplite.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "shoplite.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shoplite.labels" $ctx | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Apps don't call the Kubernetes API, so no API token in the pod (least privilege).
      # It also keeps /run/secrets free for Swarm-style secret files: the token would be
      # mounted at /var/run/secrets/kubernetes.io (/var/run -> /run) and collide.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The Dockerfiles use the non-numeric "node" user; k8s needs the UID to verify non-root
        runAsUser: 1000
      containers:
        - name: {{ $name }}
          # Per-service tag wins over the global one (services migrate at different versions)
          image: "{{ $.Values.image.repository }}/{{ $name }}:{{ $svc.tag | default $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ dig "probes" "readiness" "/health" $svc }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              # Liveness never checks dependencies, or a DB outage restarts every pod
              path: {{ dig "probes" "liveness" "/health" $svc }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with $svc.secretMounts }}
          volumeMounts:
            # Same path as Swarm secrets, so apps need no change: /run/secrets/<key>
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with $svc.secretMounts }}
      volumes:
        - name: secrets
          projected:
            sources:
              {{- range . }}
              - secret:
                  name: {{ . }}
              {{- end }}
      {{- end }}
{{- end }}
{{- end }}
