# ShopLite on Docker Swarm - the "legacy" platform we migrate away from.
# Deploy: docker stack deploy -c swarm/docker-stack.yml shoplite

# Shared defaults, reused by every service with "<<: *defaults" (plain YAML anchors)
x-defaults: &defaults
  networks: [shoplite-net]
  deploy: &deploy
    replicas: 2
    update_config:
      parallelism: 1          # replace one container at a time
      order: start-first      # start the new one before stopping the old one
      failure_action: rollback
      monitor: 15s            # watch the new container this long before continuing
    rollback_config:
      parallelism: 1
    restart_policy:
      condition: on-failure
    resources:
      reservations: { cpus: "0.05", memory: 64M }   # K8s: requests
      limits: { cpus: "0.5", memory: 128M }         # K8s: limits

services:
  users-service:
    <<: *defaults
    image: localhost:5050/shoplite/users-service:1.1.0
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/ready"]   # Swarm has one check, so use readiness
      interval: 10s
      timeout: 3s
      retries: 3

  orders-service:
    <<: *defaults
    image: localhost:5050/shoplite/orders-service:1.0.0
    environment:
      USERS_URL: http://users-service:3001   # service name = DNS name on the overlay network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    <<: *defaults
    image: localhost:5050/shoplite/frontend:1.1.0
    environment:
      PLATFORM: swarm
      USERS_URL: http://users-service:3001
      ORDERS_URL: http://orders-service:3002
    # No published port any more: Traefik is the only way in
    deploy:
      <<: *deploy
      labels:                 # Traefik reads these from the Swarm API to build its routes
        traefik.enable: "true"
        # Only the backend is defined here; the router lives in traefik/cutover.yml
        # so traffic can be split between this service and Kubernetes.
        traefik.http.services.frontend.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  traefik:
    image: traefik:v3.6
    networks: [shoplite-net]
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false        # only route services with traefik.enable=true
      - --providers.swarm.network=shoplite_shoplite-net
      - --providers.file.directory=/etc/traefik/dynamic   # tls.yml + cutover.yml
      - --providers.file.watch=true                       # apply edits live
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure   # http -> https
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --metrics.prometheus=true                       # scraped in Block 5
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only, but still powerful: access to the Docker API is effectively root on the node
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # A bind mount (not a Swarm config) because weights must change without a restart.
      # Single-node lab only: on a cluster this folder must exist on every manager.
      - ./traefik:/etc/traefik/dynamic:ro
    secrets: [shoplite_crt, shoplite_key]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # the Swarm API is only available on managers

  postgres:
    image: postgres:16-alpine
    networks: [shoplite-net]
    environment:
      POSTGRES_DB: shoplite
      POSTGRES_USER: shoplite
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # read password from the secret file
    secrets: [db_password]
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/init.sql     # Postgres runs this on first start
    volumes:
      - pgdata:/var/lib/postgresql/data                  # data outlives the container
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shoplite", "-d", "shoplite"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      # Phase 1 of the migration: Kubernetes services use this Swarm database.
      # Host mode = only on the DB node. In production: firewall it to the K8s node IPs only.
      - target: 5432
        published: 5432
        mode: host
    deploy:
      replicas: 1             # a single writer: two Postgres on one data dir would corrupt it
      placement:
        constraints: [node.role == manager]   # local volume lives on ONE node - pin it there
      update_config:
        order: stop-first     # never run old and new at the same time on the same volume
      resources:
        limits: { cpus: "1", memory: 256M }

networks:
  shoplite-net:
    driver: overlay           # spans all Swarm nodes; only this stack's services join it

volumes:
  pgdata:                     # "local" driver: stored on the node's disk, not shared between nodes

secrets:
  db_password:
    external: true            # created outside the stack (docker secret create / Ansible)
  # Swarm secrets are immutable, so each new cert gets a new name (CERT_VERSION = content hash,
  # set by Ansible). Services still see /run/secrets/shoplite_crt, so a cert rotation is a rolling update.
  shoplite_crt:
    name: shoplite_crt_${CERT_VERSION:-v1}
    file: ./certs/shoplite.crt   # generated by make-certs.sh
  shoplite_key:
    name: shoplite_key_${CERT_VERSION:-v1}
    file: ./certs/shoplite.key

configs:
  init_sql:
    file: ./init.sql          # read from disk at deploy time and stored in the Swarm
